name: Validate and deploy Quick Log

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PUBLIC_REPO_APPS_FAKE: "0"
      PUBLIC_REPO_OWNER: ${{ github.repository_owner }}
      PUBLIC_REPO_NAME: ${{ github.event.repository.name }}
      PUBLIC_REPO_BRANCH: ${{ github.event.repository.default_branch }}
      PUBLIC_APP_VERSION: ${{ github.sha }}
      PUBLIC_COMMIT_SHA: ${{ github.sha }}
      PUBLIC_GITHUB_DEVICE_CLIENT_ID: ${{ vars.REPO_APPS_GITHUB_CLIENT_ID }}
      PUBLIC_GITHUB_DEVICE_SCOPE: ${{ vars.REPO_APPS_GITHUB_DEVICE_SCOPE || 'public_repo' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.20.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test

      - name: Validate canonical and demo data
        run: pnpm validate:data

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run browser tests against the fake repository
        run: pnpm test:e2e

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Build static application
        run: pnpm build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist
          retention-days: 1

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
